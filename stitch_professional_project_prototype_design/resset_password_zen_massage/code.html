<style>
        body {
            background-color: #faf9f7;
            color: #1a1c1b;
            font-family: 'Hanken Grotesk', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .fade-in {
            animation: fadeIn 1s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden relative">
<!-- Atmospheric Background Animation -->

<main class="relative z-10 w-full max-w-md fade-in">
<div class="glass-card rounded-xl p-stack-lg shadow-sm">
<!-- Brand Identity -->
<div class="flex flex-col items-center mb-stack-lg">
<div class="w-16 h-16 bg-primary-fixed rounded-full flex items-center justify-center mb-stack-md text-primary">
<span class="material-symbols-outlined !text-4xl" data-icon="spa">spa</span>
</div>
<h1 class="font-headline-md text-headline-md text-sage-deep mb-base">Zen Wellness</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center px-gutter">
                    Sérénité retrouvée. Entrez votre email pour réinitialiser votre accès.
                </p>
</div>
<!-- Recovery Form -->
<form class="space-y-stack-md" id="recoveryForm">
<div class="relative">
<label class="block font-label-md text-label-md text-secondary mb-base ml-1" for="email">
                        Adresse Email
                    </label>
<input class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant focus:border-primary focus:ring-0 transition-all px-4 py-3 font-body-md text-body-md text-on-surface rounded-t-lg placeholder:text-on-surface-variant/40" id="email" name="email" placeholder="nom@exemple.com" required="" type="email"/>
</div>
<button class="w-full group relative overflow-hidden bg-primary text-on-primary py-4 rounded-xl font-label-md text-label-md transition-all hover:bg-sage-deep active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
<span>Envoyer le lien de réinitialisation</span>
<span class="material-symbols-outlined !text-lg transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Success Message (Hidden by default) -->
<div class="hidden text-center py-stack-md" id="successMessage">
<div class="w-12 h-12 bg-status-confirmed/20 text-status-confirmed rounded-full flex items-center justify-center mx-auto mb-stack-md">
<span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<p class="font-headline-sm text-headline-sm text-sage-deep mb-base">Lien envoyé</p>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Consultez votre boîte de réception pour continuer.
                </p>
</div>
<!-- Back to Login -->
<div class="mt-stack-lg pt-stack-md border-t border-outline-variant/30 flex justify-center">
<a class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md" href="#">
<span class="material-symbols-outlined !text-lg" data-icon="keyboard_backspace">keyboard_backspace</span>
                    Retour à la connexion
                </a>
</div>
</div>
<!-- Supportive Visual Element -->
<div class="mt-stack-lg flex justify-center opacity-60">
<div class="flex items-center gap-stack-sm text-on-surface-variant font-caption text-caption">
<span class="material-symbols-outlined !text-sm" data-icon="lock">lock</span>
<span>Connexion sécurisée par cryptage 256-bit</span>
</div>
</div>
</main>
<!-- Footer Quote (Subtle) -->
<footer class="fixed bottom-gutter left-0 w-full text-center pointer-events-none">
<p class="font-headline-sm text-headline-sm text-on-surface-variant/20 italic opacity-50">
            Le calme est le berceau de la clarté.
        </p>
</footer>
<script>
        document.getElementById('recoveryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            const originalContent = btn.innerHTML;
            
            // Subtle loading state
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
            btn.disabled = true;

            setTimeout(() => {
                this.classList.add('hidden');
                document.getElementById('successMessage').classList.remove('hidden');
                document.getElementById('successMessage').classList.add('fade-in');
            }, 1500);
        });

        // Interactive focus effect
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.closest('.glass-card').style.boxShadow = '0 10px 40px -15px rgba(66, 86, 70, 0.15)';
            });
            input.addEventListener('blur', () => {
                input.parentElement.closest('.glass-card').style.boxShadow = 'none';
            });
        });
    </script>
</body></html>
